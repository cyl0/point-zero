# POINT ZERO config

# Optional community ratings, uncomment one to enable
# Multiple can be enabled at the same time. Ratings are taken from the last loaded file if overlaps exist.

# SP Ratings
rating-file-sp=point-zero/ratings/point-zero-sp.json
#rating-file-sp=point-zero/ratings/cpi-sp-ec.json
#rating-file-sp=point-zero/ratings/cpi-sp-ex.json
#rating-file-sp=point-zero/ratings/cpi-sp-fc.json
#rating-file-sp=point-zero/ratings/cpi-sp-hc.json
#rating-file-sp=point-zero/ratings/cpi-sp-nc.json
#rating-file-sp=point-zero/ratings/sp12-irt-nc.json
#rating-file-sp=point-zero/ratings/sp12-irt-hc.json

# DP Ratings
rating-file-dp=point-zero/ratings/point-zero-dp.json
#rating-file-dp=point-zero/ratings/ereter-dp-ec.json
#rating-file-dp=point-zero/ratings/ereter-dp-ex.json
#rating-file-dp=point-zero/ratings/ereter-dp-hc.json
#rating-file-dp=point-zero/ratings/sakura-dp-nc.json

# Rating scale adaptation to use when multiple ratings are enabled.
# default: affine, accepts: affine, none
scale-adaptation-sp=affine
scale-adaptation-dp=affine

# Scale Reference: Rating file to use as the reference scale when multiple are enabled.
# Keep the primary SP/DP decimal scales when enabling optional packs above.
# Any listed rating file can be selected explicitly. Use last to select the last suitable source;
# differently scaled raw units (such as CPI/IRT) may then clamp at the display bounds.
scale-reference-sp=point-zero/ratings/point-zero-sp.json
scale-reference-dp=point-zero/ratings/point-zero-dp.json

# Update channel to use for checking for updates. Accepts: stable, preview
update-channel=preview
